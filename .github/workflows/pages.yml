# Build and publish the documentation site.
#
# Two jobs with different jobs to do. `build` runs on every pull request that
# touches the docs and fails on a broken link -- that is the part that catches
# mistakes, and it is not allowed to fail. `deploy` runs on a release tag and
# publishes that version with `mike`.
#
# The documentation is published once per release, at its own version, so
# somebody running an older repetita can read the pages that describe it.
# `latest` is an alias mike repoints on every deploy, and the bare URL follows
# it.
#
# One-off setup, which has to be done by hand once:
#   Settings -> Pages -> Source: "Deploy from a branch", branch `gh-pages`, /
#   then, after the first deploy:  mike set-default latest --push
name: Docs

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/gen_schema_doc.py"
      - "src/repetita/store/db.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to deploy (e.g. 0.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every pull request that touches the docs. Nothing is published.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements-docs.txt
      # Strict, so a link to a page that does not exist fails the build rather
      # than shipping a dead link nobody notices for six months.
      - run: mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike needs the gh-pages branch, not just this commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements-docs.txt

      # v0.2.3 publishes as 0.2: a patch release documents the same minor, and a
      # directory per patch would be thirty copies of the same pages.
      - name: Which version these docs are
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "docs=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME#v}"
            echo "docs=${tag%.*}" >> "$GITHUB_OUTPUT"
          fi

      # --alias-type=copy, because mike's default makes `latest` a symlink and
      # GitHub Pages does not follow one -- /repetita/latest/ would serve a 404.
      # Git stores the duplicate tree as the same blobs, so the copy costs
      # nothing that the symlink was saving.
      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases --alias-type=copy \
            "${{ steps.v.outputs.docs }}" latest

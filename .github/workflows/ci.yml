name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # A project virtualenv rather than `--system`: the runner's system Python
      # is externally managed (PEP 668) and refuses installs.
      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src/repetita
      - name: Tests
        run: uv run pytest --cov=repetita --cov-report=term-missing
      # Here rather than in the `schema-doc` job, which deliberately installs
      # nothing: this one reads the registry, so it needs the package.
      - name: Exercise-type docs are current
        run: uv run python scripts/gen_types_doc.py --check

  schema-doc:
    # A generated file that drifts is worse than none, because it is believed.
    # Same shape as `check-ids`: the check lives in CI, not in a convention.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No install: the script loads `store/db.py` on its own, and that file
      # imports nothing but the standard library.
      - run: python scripts/gen_schema_doc.py --check

  language-neutral:
    # CLAUDE.md rule 4: the engine knows nothing about any particular language.
    # Checked by parsing the source rather than grepping it, so that a comment
    # *explaining* the rule does not trip it -- which is exactly what the first
    # version of this job did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_language_neutral.py src/repetita

# Jak czytać tagi tego kursu. `source` mówi, przy czym dane słowo zostało
# zapisane -- na korepetycjach, przy podręczniku, samo z siebie. To notatka o
# tym, skąd się wzięło w mojej głowie, a nie o tym, czyj jest tekst: listy słówek
# w tym kursie przepisałem sam z własnych lekcji.
#
# `tutor` -- inaczej. Do niedawna też mówił tylko "czyje to były lekcje", ale od
# kiedy w bazie są konta, ten sam podział decyduje, kto może dany set zmieniać
# (ADR-0016): `repetita own --axis tutor` przepisuje go na `units.owner`.
# Zmiana tagu tutaj nie zmienia właściciela -- to osobna kolumna i osobna
# decyzja -- ale rozjazd między nimi będzie mylący, więc lepiej trzymać je
# zgodnie.
axes:
  level:
    title:
      pl: Poziom
      en: Level
    values:
      - A1
      - A2
      - B1
      - B2
      - C1
      - C2
    ordered: true
    max_per_note: 1
  track:
    title:
      pl: Rodzaj
      en: Track
    values:
      - vocab
      - phrases
      - idioms
      - grammar
  source:
    title:
      pl: Źródło
      en: Source
    values:
      - wlasne
      - korepetycje
      - podrecznik
      - quizlet
  # Whose lessons a set came from. The directory names spell one person three
  # ways -- karolinka, karolka, karolina -- which is how they were typed at the
  # time and not worth rewriting; the tag is what makes them one person again.
  tutor:
    title:
      pl: Nauczyciel
      en: Tutor
    # Kto prowadził lekcję, przy której to powstało -- i, od czasu kont, kto
    # opiekuje się tym setem. Patrz komentarz na górze pliku.
    values:
      - karolina
      - radek
      - malgosia
  topic:
    title:
      pl: Temat
      en: Topic
    catch_all: true

- id: gram-preterito-imperfeito.contraste-01
  prompt: Ontem eu ___ (ir) à praia uma vez.
  cue: ir — perfeito, eu (jednorazowo, wczoraj)
  translation: Wczoraj poszedłem na plażę.
  answers:
  - fui
  explain: 'Perfeito = zdarzenie zamknięte. Imperfeito (ia) = nawyk: eu ia à praia todo dia.'
- id: gram-preterito-imperfeito.contraste-02
  prompt: Quando criança, eu ___ (ir) à praia todo dia.
  cue: ir — imperfeito, eu (nawyk w dzieciństwie)
  translation: Jako dziecko chodziłem na plażę codziennie.
  answers:
  - ia
  explain: „Todo dia” w przeszłości wymusza imperfeito.
- id: gram-preterito-imperfeito.contraste-03
  prompt: Eu ___ (estar) no Pelourinho quando começou a chover.

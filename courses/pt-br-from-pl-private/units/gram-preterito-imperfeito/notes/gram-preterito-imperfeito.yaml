  explain: Zdarzenie punktowe na tle imperfeito zawsze idzie w perfeito.
- id: gram-preterito-imperfeito.contraste-05
  prompt: Naquele tempo nós ___ (treinar) na rua, sem academia.
  cue: treinar — imperfeito, nós (stan trwały w przeszłości)
  translation: W tamtych czasach trenowaliśmy na ulicy, bez sali.
  answers:

title:
  pl: Ser i estar
  en: Ser and estar
description:
  pl: 'Dwa czasowniki „być”: cecha stała kontra stan chwilowy. Jeden z nielicznych
    podziałów bez odpowiednika w polskim.'
  en: 'Two verbs for “to be”: a lasting property against a present state. One of the
    few splits with no Polish equivalent.'

title:
  pl: Czas teraźniejszy ciągły
  en: The present continuous
description:
  pl: 'Estar + gerúndio: „robię to teraz” kontra „robię to zawsze”. Różnica, której
    polski nie zaznacza.'
  en: 'Estar + gerúndio: “I am doing it now” against “I do it always”. A distinction
    Polish does not mark.'

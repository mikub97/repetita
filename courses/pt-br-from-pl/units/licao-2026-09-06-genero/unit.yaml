title:
  pl: Rodzaj rzeczownika
  en: Noun gender
description:
  pl: O czy a — w tym rzeczowniki na -ema i -ista, które wyglądają na żeńskie i nie
    są. Odpowiedzią jest rodzajnik, więc podpowiedzią jest samo słowo.
  en: O or a — including the -ema and -ista nouns that look feminine and are not.
    The answer is the article, so the cue is the word itself.

title:
  pl: Urodziny Heleny
  en: Helena's birthday
description:
  pl: Jeden ciągły tekst z czasownikami do odmiany w czasie przeszłym. Zdania idą
    po kolei, więc czyta się go jak opowiadanie.
  en: One continuous text with verbs to put into the past. The sentences run in order,
    so it reads as a story.

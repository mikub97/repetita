title:
  pl: Przyimki (1 września)
  en: Prepositions (1 Sept)
description:
  pl: 'Materiał z lekcji: de, em, para, por i ich ściągnięcia. Przyimki rzadko odpowiadają
    polskim przypadkom jeden do jednego.'
  en: 'From the lesson: de, em, para, por and their contractions. Prepositions rarely
    map one-to-one onto Polish cases.'

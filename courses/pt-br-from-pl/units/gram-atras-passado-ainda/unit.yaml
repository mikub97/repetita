title:
  pl: Atrás, passado, ainda
  en: Atrás, passado, ainda
description:
  pl: Trzy słowa czasu, które nie zachowują się jak polskie odpowiedniki. Mylą się
    ze sobą, więc ćwiczone są razem.
  en: Three time words that do not behave like their Polish equivalents. They are
    confused with each other, so they are drilled together.

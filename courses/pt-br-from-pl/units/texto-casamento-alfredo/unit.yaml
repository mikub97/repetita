title:
  pl: Ślub Alfreda
  en: Alfredo's wedding
description:
  pl: Ten sam pomysł co urodziny Heleny, ale o przyimki i ściągnięcia. Wiele luk to
    to samo słowo — to nie pomyłka.
  en: The same idea as Helena's birthday, but for prepositions and contractions. Many
    gaps are the same word, which is not a mistake.

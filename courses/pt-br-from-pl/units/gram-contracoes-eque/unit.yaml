title:
  pl: Ściągnięcia i „é que”
  en: Contractions and “é que”
description:
  pl: De + o, em + a, i wzmocnienie „é que”. Krótkie formy, które w mowie są obowiązkowe,
    a nie opcjonalne.
  en: De + o, em + a, and the “é que” emphasis. Short forms that are obligatory in
    speech rather than optional.

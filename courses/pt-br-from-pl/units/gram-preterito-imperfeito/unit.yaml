title:
  pl: Czas przeszły niedokonany
  en: The imperfect
description:
  pl: 'To, co było zwyczajem albo tłem: „mieszkałem”, „zawsze chodziliśmy”. Największy
    zestaw gramatyczny i ten, który najdłużej się układa.'
  en: 'What was habitual or background: “I used to live”, “we always went”. The largest
    grammar set, and the one that takes longest to settle.'

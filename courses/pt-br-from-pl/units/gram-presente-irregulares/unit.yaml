title:
  pl: Teraźniejszy nieregularny
  en: Irregular present
description:
  pl: Ser, ter, ir, fazer, poder i reszta. Najczęstsze czasowniki są nieregularne,
    więc ten zestaw jest duży.
  en: Ser, ter, ir, fazer, poder and the rest. The commonest verbs are the irregular
    ones, which is why this set is large.

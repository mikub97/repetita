title:
  pl: Rozmowy na treningu
  en: Talking at training
description:
  pl: Zwroty do powiedzenia na głos w rodzie — powitania, prośby, przeprosiny. Oceniasz
    się sam, bo nikt tu jeszcze nie słucha.
  en: Phrases to say out loud in the roda — greetings, requests, apologies. Self-assessed,
    because nothing here can hear you yet.

[tool.hatch.version]
# One version, in the package. Bumping two files by hand is a release that
# reports the wrong number, which is what happened cutting v0.2.0.
path = "src/repetita/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repetita"
dynamic = ["version"]
description = "An open, hackable engine for learning a language from scratch: spaced repetition, many study modes, community-contributable courses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michał Weiss" }]
keywords = ["spaced-repetition", "srs", "fsrs", "language-learning", "flashcards"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]

# Runtime deps stay deliberately small. `fsrs` is MIT and pulls only
# typing-extensions; the FSRS *optimizer* pulls torch (~2GB) and therefore lives
# in an extra that nothing in the serving path imports.
dependencies = [
  "flask>=3.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "fsrs>=6.3,<7",
]

[project.optional-dependencies]
# FSRS-7 will change behaviour (fractional intervals, 34 params). That must be an
# explicit, tested migration, never a transitive upgrade -- hence the <7 pin above.
optimizer = ["fsrs[optimizer]>=6.3,<7"]
# Refines distractor ordering by how common a word is. 63MB, and the engine
# works without it -- absence changes polish, not correctness.
distractors = ["wordfreq>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit",
  "check-jsonschema",
  "types-PyYAML",
  "wordfreq>=3.1",
]
# Kept in step with requirements-docs.txt, which is what CI installs -- the
# extra is the convenience for someone already working in the project.
docs = ["mkdocs-material>=9.5,<10", "mike>=2.1,<3", "mkdocstrings[python]"]

[project.scripts]
repetita = "repetita.cli:main"

[project.urls]
Homepage = "https://github.com/mikub97/repetita"
Documentation = "https://github.com/mikub97/repetita#readme"
Issues = "https://github.com/mikub97/repetita/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repetita"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/repetita"]

[[tool.mypy.overrides]]
module = "wordfreq"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
